# Cloudflare Workers (static assets) configuration. The Workers Builds project's root directory is "web",
# so this file lives here. Dashboard: Deploy command "npx wrangler deploy" (Build command may stay empty:
# wrangler runs [build] below before every deploy, so dist/ always exists).
name = "kho-tu-toeic"
compatibility_date = "2026-11-01"

[build]
command = "npm run build"

[assets]
directory = "./dist"
# Deep links (/vocab/set/…) get index.html; the React router takes it from there.
not_found_handling = "single-page-application"

# Secrets (phase 2) are added in the dashboard under Settings → Variables and Secrets, never here.
