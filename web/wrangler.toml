# Cloudflare Worker for the app. Workers Builds: root directory "web", build command "npm ci",
# deploy command "npx wrangler deploy" (wrangler runs [build] below first, so dist/ always exists).
name = "toeic-vocab"
main = "worker/index.js"
compatibility_date = "2026-11-01"
# Keep the variables and secrets set in the dashboard (Firebase keys) when deploying from the repo.
keep_vars = true

[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
# Deep links (/vocab/set/…) get index.html; the React router takes it from there.
not_found_handling = "single-page-application"
# The Worker answers these itself; every other path is a static file served without running the Worker.
run_worker_first = ["/api/*", "/vocab.json"]

[triggers]
# Every 10 minutes: 20:00 reminder to the learner, 23:00 missed-day alert to the coach (see worker/decide.js).
crons = ["*/10 * * * *"]

[vars]
TIMEZONE = "Asia/Ho_Chi_Minh"

# Firebase keys are NOT here. Add them in the dashboard (Settings → Variables and Secrets):
#   FIREBASE_API_KEY, FIREBASE_PROJECT_ID, FIREBASE_APP_ID, FIREBASE_MESSAGING_SENDER_ID, FIREBASE_VAPID_KEY
#   FIREBASE_SERVICE_ACCOUNT (type: Secret) = the whole service-account JSON file
