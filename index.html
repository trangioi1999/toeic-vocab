<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kho Từ TOEIC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Charis+SIL:ital@0;1&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky top bar; home = progress summary + group tiles; group = set list; study = breadcrumb, mode tabs, flip card. */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --surface-2:#EDF0F7; --ink:#131A30; --muted:#5E6886; --faint:#8D96B0; --line:#E0E5EF;
  --primary:#3654F0; --primary-soft:#E7EBFF; --on-primary:#FFFFFF;
  --known:#139A62; --known-soft:#DDF4E8; --learn:#C97F00; --learn-soft:#FFF0CF; --new:#B7BED0;
  --bad:#D23F3F; --bad-soft:#FCE6E6;
  --shadow:0 1px 2px rgba(19,26,48,.05),0 8px 24px -12px rgba(19,26,48,.18);
  --display:"Lexend","Be Vietnam Pro",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ipa:"Charis SIL","Doulos SIL","Lucida Sans Unicode","Segoe UI",serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1222; --surface:#151C30; --surface-2:#1C2540; --ink:#E9EDF8; --muted:#A0A9C3; --faint:#717B98; --line:#26304C;
  --primary:#8297FF; --primary-soft:#232D55; --on-primary:#0D1222;
  --known:#4FD394; --known-soft:#14352A; --learn:#F2B84B; --learn-soft:#3A2E14; --new:#404A66;
  --bad:#FF8D8D; --bad-soft:#3D1F26; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1222; --surface:#151C30; --surface-2:#1C2540; --ink:#E9EDF8; --muted:#A0A9C3; --faint:#717B98; --line:#26304C;
  --primary:#8297FF; --primary-soft:#232D55; --on-primary:#0D1222;
  --known:#4FD394; --known-soft:#14352A; --learn:#F2B84B; --learn-soft:#3A2E14; --new:#404A66;
  --bad:#FF8D8D; --bad-soft:#3D1F26; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;font:600 17px var(--display);letter-spacing:-.01em}
.logo{width:30px;height:30px;border-radius:9px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font:700 13px var(--display)}
.search{flex:1;min-width:180px;position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{width:100%;height:40px;padding:0 14px 0 38px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);font:inherit}
.search input:focus{outline:none;border-color:var(--primary);background:var(--surface)}
.pill{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--new)}
.dot.k{background:var(--known)} .dot.l{background:var(--learn)}

main{padding-block:22px 80px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px}
.crumbs button{background:none;border:0;padding:0;color:var(--primary);cursor:pointer;font-weight:500}
.crumbs span.sep{color:var(--faint)}
h1{font:600 clamp(22px,3.6vw,30px)/1.2 var(--display);letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
h2{font:600 18px var(--display);margin:30px 0 12px;letter-spacing:-.01em}
h3{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 0 10px}
.sub{color:var(--muted);margin:0}

/* segmented progress */
.seg{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.seg i{display:block;height:100%}
.seg .k{background:var(--known)} .seg .l{background:var(--learn)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{color:var(--ink);font:600 13px var(--mono);font-variant-numeric:tabular-nums}

/* summary panel */
.summary{display:grid;grid-template-columns:1fr auto;gap:18px 28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow);margin-top:18px}
.summary .big{font:600 34px/1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.summary .big small{font:500 14px var(--body);color:var(--muted);letter-spacing:0;margin-left:6px}
.summary .col{display:flex;flex-direction:column;gap:12px;min-width:0}
.summary .acts{display:flex;flex-direction:column;gap:8px}
@media (max-width:640px){.summary{grid-template-columns:1fr}.summary .acts{flex-direction:row;flex-wrap:wrap}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:default}
.btn.known{background:var(--known-soft);border-color:transparent;color:var(--known)}
.btn.learn{background:var(--learn-soft);border-color:transparent;color:var(--learn)}

/* group tiles */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;min-width:0;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--primary)}
.tile .name{font:600 16px/1.3 var(--display);letter-spacing:-.01em}
.tile .desc{font-size:13px;color:var(--muted);margin-top:2px}
.tile .meta{display:flex;justify-content:space-between;font:500 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}

/* set rows */
.sets{display:grid;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer}
.row:hover{border-color:var(--primary)}
.row b{font-weight:600;overflow-wrap:anywhere}
.row .n{font:500 12px var(--mono);color:var(--muted);text-align:right;min-width:62px;font-variant-numeric:tabular-nums}
@media (max-width:560px){.row{grid-template-columns:minmax(0,1fr) auto}.row .seg{grid-column:1/-1;order:3}}
.hdr{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.hdr .acts{display:flex;gap:8px;flex-wrap:wrap}

/* study */
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px;margin:18px 0 12px;overflow-x:auto}
.tab{flex:1;min-width:max-content;background:none;border:0;border-radius:9px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
.chip .c{font:500 11px var(--mono)}
.spacer{flex:1}
.opt{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:99px;background:var(--surface-2);font-size:13px;color:var(--muted);cursor:pointer;user-select:none;border:0}
.opt[aria-pressed="true"]{color:var(--ink);background:var(--primary-soft)}
.opt svg{flex:none}

.stage{perspective:1400px}
.flip{position:relative;height:340px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.2,1);cursor:pointer}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:48px 28px 40px;text-align:center;overflow:auto}
.face.back{transform:rotateY(180deg);background:linear-gradient(180deg,var(--surface),var(--surface-2))}
.face .lang{position:absolute;top:16px;right:18px;font:600 11px var(--mono);letter-spacing:.08em;color:var(--faint)}
.face .st{position:absolute;top:14px;left:16px}
.word{font:600 clamp(26px,5vw,40px)/1.2 var(--display);letter-spacing:-.02em;overflow-wrap:anywhere;white-space:pre-line;max-width:100%}
.mean{font:500 clamp(20px,3.8vw,28px)/1.35 var(--display);overflow-wrap:anywhere;white-space:pre-line;max-width:100%}
.ipa{font:400 19px var(--ipa);color:var(--muted)}
.ipa.sm{font-size:15px}
.small-term{font-weight:600;color:var(--muted);font-size:14px}
.say{display:flex;gap:8px;margin-top:6px}
.sbtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.sbtn:hover{color:var(--primary);border-color:var(--primary)}
.hint{position:absolute;bottom:14px;font-size:12px;color:var(--faint)}
.status{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.status.k{background:var(--known-soft);color:var(--known)} .status.l{background:var(--learn-soft);color:var(--learn)}
.prog{height:4px;border-radius:2px;background:var(--surface-2);margin:16px 0 14px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--primary);transition:width .2s}
.ctl{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:10px;align-items:center}
.ctl .btn{height:48px}
.count{text-align:center;font:600 13px var(--mono);color:var(--muted);margin-top:10px;font-variant-numeric:tabular-nums}
.keys{text-align:center;font-size:12px;color:var(--faint);margin-top:8px}
kbd{font:500 11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:var(--surface)}
@media (max-width:560px){.flip{height:300px}.keys{display:none}.search{order:3;flex-basis:100%}.top .wrap{row-gap:8px}.tab{padding:8px 8px;font-size:13px}.tabs{overflow-x:visible}}

/* quiz */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow)}
.qtop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font:600 12px var(--mono);color:var(--muted)}
.qtop .g{color:var(--known)} .qtop .r{color:var(--bad)}
.qprompt{margin:18px 0 6px;display:flex;flex-direction:column;gap:6px}
.answers{display:grid;gap:8px;margin-top:18px}
.ans{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;min-width:0;font-size:15px}
.ans>span:last-child{min-width:0;overflow-wrap:anywhere;white-space:pre-line}
.ans .k{flex:none;width:28px;height:28px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font:600 12px var(--mono);color:var(--muted)}
.ans:hover:not(:disabled){border-color:var(--primary)}
.ans.right{border-color:var(--known);background:var(--known-soft)} .ans.right .k{background:var(--known);color:var(--surface)}
.ans.wrong{border-color:var(--bad);background:var(--bad-soft)} .ans.wrong .k{background:var(--bad);color:var(--surface)}
.ans:disabled{cursor:default}
.winput{width:100%;height:54px;padding:0 16px;font:500 18px var(--body);border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin-top:16px}
.winput:focus{outline:none;border-color:var(--primary)}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-weight:500}
.fb.ok{background:var(--known-soft);color:var(--known)} .fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb b{color:var(--ink)}
.qact{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.result{text-align:center;padding:36px 16px}
.result .big{font:600 52px var(--display);letter-spacing:-.03em;margin:4px 0 8px}

/* list */
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) auto;gap:14px;align-items:start;padding:12px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-weight:600;white-space:pre-line;overflow-wrap:anywhere}
.item .m{white-space:pre-line;overflow-wrap:anywhere}
.item .from{display:block;font-size:12px;color:var(--faint);margin-top:2px}
.item .acts{display:flex;gap:2px}
.ib{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;border:0;background:none;cursor:pointer;color:var(--muted)}
.ib:hover{background:var(--surface-2);color:var(--primary)}
.sdot{width:26px;height:26px;border-radius:50%;border:0;background:none;display:grid;place-items:center;cursor:pointer;margin-top:-2px}
.sdot .dot{width:12px;height:12px}
@media (max-width:640px){.item{grid-template-columns:auto minmax(0,1fr) auto}.item .m{grid-column:2/3}}
.empty{padding:48px 16px;text-align:center;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){.flip{transition:none}}
</style>

<header class="top"><div class="wrap">
  <button class="brand" id="home" type="button"><span class="logo">T</span>Kho Từ TOEIC</button>
  <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Tìm từ tiếng Anh hoặc nghĩa tiếng Việt" autocomplete="off" aria-label="Tìm từ"></label>
  <span class="pill" id="topstat"></span>
</div></header>
<main class="wrap" id="app"><p class="empty">Đang tải dữ liệu…</p></main>
<div class="toast" id="toast" hidden></div>

<script>
(()=>{
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const fmt=n=>n.toLocaleString('vi-VN');
const IC={
  spk:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
  shuf:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>',
  swap:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg>',
  auto:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M16 9l5 6M21 9l-5 6"/></svg>',
};

/* ---------- status: 0 chưa học · 1 đang học · 2 đã thuộc ---------- */
let ST=LS.get('status',null);
if(!ST){ST={};for(const k of LS.get('known',[]))ST[k]=2}
const saveST=()=>LS.set('status',ST);
const key=it=>it.sid+':'+it.i;
const stOf=it=>ST[key(it)]||0;
function setSt(it,v){const k=key(it);if(v)ST[k]=v;else delete ST[k];saveST();topstat()}
const ST_LABEL=['Chưa học','Đang học','Đã thuộc'], ST_CLS=['','l','k'];
const badge=v=>`<span class="status ${ST_CLS[v]}"><span class="dot ${ST_CLS[v]}"></span>${ST_LABEL[v]}</span>`;
function counts(items){const c=[0,0,0];for(const it of items)c[stOf(it)]++;return c}
function segBar(c){const t=c[0]+c[1]+c[2]||1;return `<div class="seg" role="img" aria-label="${c[2]} đã thuộc, ${c[1]} đang học, ${c[0]} chưa học"><i class="k" style="width:${c[2]/t*100}%"></i><i class="l" style="width:${c[1]/t*100}%"></i></div>`}

/* ---------- groups ---------- */
const GROUPS=[
  {id:'tu-vung-toeic',name:'Từ vựng TOEIC theo thẻ',desc:'Bộ thẻ 1 – 74, mỗi thẻ 20 từ',test:t=>/^T[ỪU]\s*V[ỰƯU]NG\s*TOEIC/iu.test(t)||/^thẻ\s*\d+$/iu.test(t)},
  {id:'listening',name:'Từ vựng Listening',desc:'Danh sách từ vựng phần nghe',test:t=>/^LIST\s/i.test(t)},
  {id:'luyen-nghe',name:'Luyện nghe',desc:'Part 1 và Part 4 theo đề',test:t=>/^LUYỆN NGHE/iu.test(t)},
  {id:'part-1',name:'Part 1 theo chủ đề',desc:'Văn phòng, nhà hàng, giao thông…',test:t=>/NGHE PHẦN 1/iu.test(t)},
  {id:'co-ban',name:'Từ vựng cơ bản',desc:'Danh từ, động từ, tính từ',test:t=>/^Lesson/i.test(t)},
  {id:'600',name:'TOEIC 600 từ',desc:'Bộ 600 từ kinh điển',test:t=>/600/.test(t)},
  {id:'dong-nghia',name:'Từ đồng nghĩa nâng cao',desc:'Các cặp từ thay thế hay gặp',test:t=>/ĐỒNG NGHĨA/iu.test(t)},
  {id:'ets',name:'ETS',desc:'Từ vựng theo đề ETS 2017 – 2024',test:t=>/^ETS/i.test(t),sub:t=>{const m=t.match(/ETS\s*(\d{4})/i);return m?'ETS '+m[1]:'ETS'}},
  {id:'economy',name:'Economy',desc:'Từ vựng theo đề Economy',test:t=>/ECONOMY/i.test(t),sub:t=>{const m=t.match(/TEST\s*(\d+)/i);return m?'Test '+m[1]:'Khác'}},
  {id:'ybm',name:'YBM',desc:'Từ vựng theo đề YBM',test:t=>/^YBM/i.test(t)},
  {id:'tnc',name:'TNC',desc:'Part 5, 6, 7 theo đề TNC',test:t=>/^TNC/i.test(t)},
  {id:'ngu-phap',name:'Ngữ pháp & mẹo làm bài',desc:'Ngữ pháp cơ bản, mẹo Part 7',test:t=>/NGỮ PHÁP|CÁCH XỬ LÝ/iu.test(t)},
  {id:'khac',name:'Học phần khác',desc:'Các học phần lẻ',test:()=>true},
];
const deacc=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/gi,'d').toLowerCase();
const sortKey=t=>deacc(t).replace(/cuoi/g,'9999').replace(/[^a-z0-9]+/g,'').replace(/^the(?=\d)/,'tuvungtoeicthe').replace(/\d+/g,d=>d.padStart(5,'0'));

let DATA=[],SETS=new Map(),GMAP=new Map();
function prepare(d){
  DATA=d.filter(s=>s.cards&&s.cards.length);
  for(const s of DATA){
    s.id=String(s.id);s.items=s.cards.map((c,i)=>({c,sid:s.id,i}));
    s.group=GROUPS.find(g=>g.test(s.title));s.k=sortKey(s.title);SETS.set(s.id,s);
  }
  for(const g of GROUPS){g.sets=DATA.filter(s=>s.group===g).sort((a,b)=>a.k<b.k?-1:a.k>b.k?1:0);if(g.sets.length)GMAP.set(g.id,g)}
}
const allItems=()=>DATA.flatMap(s=>s.items);
const groupItems=g=>g.sets.flatMap(s=>s.items);

/* ---------- speech ---------- */
const isEn=s=>!!s&&/^[\x00-\x7F’‘–—…]*$/.test(s.replace(/\s/g,''));
let voices=[];const loadV=()=>{try{voices=speechSynthesis.getVoices()}catch(e){}};loadV();try{speechSynthesis.onvoiceschanged=loadV}catch(e){}
let warnedVi=false;
function clean(t,en){t=String(t).replace(/\b(sb|sth|s\.o|Vo|Ving|V3\/ed)\b/gi,' ').replace(/[=#\/]/g,', ').replace(/\((n|v|adj|adv)\)/gi,'');return t.replace(/\s+/g,' ').trim()}
function say(text,lang){
  try{
    if(!text)return;lang=lang||(isEn(text)?'en':'vi');
    const v=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith(lang)&&/natural|google|premium|enhanced/i.test(v.name))||voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith(lang));
    if(lang==='vi'&&!v&&voices.length&&!warnedVi){warnedVi=true;toast('Máy bạn chưa có giọng đọc tiếng Việt. Hãy cài thêm giọng "Vietnamese" trong cài đặt hệ thống.')}
    const u=new SpeechSynthesisUtterance(clean(text));u.lang=lang==='en'?'en-US':'vi-VN';if(v)u.voice=v;u.rate=lang==='en'?.9:1;
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){}
}
function sayBoth(it){try{const [en,vi]=enVi(it);speechSynthesis.cancel();
  const a=new SpeechSynthesisUtterance(clean(en));a.lang='en-US';const va=voices.find(v=>v.lang?.toLowerCase().startsWith('en'));if(va)a.voice=va;a.rate=.9;
  const b=new SpeechSynthesisUtterance(clean(vi));b.lang='vi-VN';const vb=voices.find(v=>v.lang?.toLowerCase().startsWith('vi'));if(vb)b.voice=vb;
  speechSynthesis.speak(a);speechSynthesis.speak(b)}catch(e){}}
const enVi=it=>isEn(it.c[0])||!isEn(it.c[1])?[it.c[0],it.c[1]]:[it.c[1],it.c[0]];
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,4200)}

function topstat(){const c=counts(allItems());$('#topstat').innerHTML=`<span class="dot k"></span>${fmt(c[2])} / ${fmt(c[0]+c[1]+c[2])} đã thuộc`}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const crumbs=parts=>`<nav class="crumbs" aria-label="Đường dẫn">${parts.map((p,i)=>(i?'<span class="sep">›</span>':'')+(p.go?`<button type="button" data-go="${p.go}">${esc(p.t)}</button>`:`<span>${esc(p.t)}</span>`)).join('')}</nav>`;
function bindCrumbs(){app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>nav(b.dataset.go))}
function nav(h){if(location.hash===h||(h==='#'&&!location.hash))route();else location.hash=h}

/* ---------- home ---------- */
function home(){
  view=null;const all=allItems(),c=counts(all);
  let h=`<h1>Lớp TOEIC Online</h1><p class="sub">${GMAP.size} nhóm · ${DATA.length} học phần · ${fmt(all.length)} thẻ từ vựng</p>
  <section class="summary"><div class="col">
    <div class="big">${fmt(c[2])}<small>thẻ đã thuộc</small></div>${segBar(c)}
    <div class="legend"><span><i class="dot k"></i>Đã thuộc <b>${fmt(c[2])}</b></span><span><i class="dot l"></i>Đang học <b>${fmt(c[1])}</b></span><span><i class="dot"></i>Chưa học <b>${fmt(c[0])}</b></span></div>
  </div><div class="acts">
    <button class="btn primary" id="rv" type="button" ${c[1]?'':'disabled'}>Ôn ${Math.min(30,c[1])} thẻ đang học</button>
    <button class="btn" id="nw" type="button" ${c[0]?'':'disabled'}>Học 20 thẻ mới</button>
  </div></section>
  <h2>Nhóm học phần</h2><div class="groups">`;
  for(const g of GMAP.values()){const it=groupItems(g),gc=counts(it);
    h+=`<button class="tile" type="button" data-g="${g.id}"><div><div class="name">${esc(g.name)}</div><div class="desc">${esc(g.desc)}</div></div>${segBar(gc)}<div class="meta"><span>${g.sets.length} học phần · ${fmt(it.length)} thẻ</span><span>${Math.round(gc[2]/it.length*100)}%</span></div></button>`}
  app.innerHTML=h+'</div>';
  app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>nav('#g-'+b.dataset.g));
  $('#rv').onclick=()=>study({title:'Ôn thẻ đang học',items:shuffle(all.filter(it=>stOf(it)===1)).slice(0,30),back:'#'});
  $('#nw').onclick=()=>study({title:'Học 20 thẻ mới',items:shuffle(all.filter(it=>!stOf(it))).slice(0,20),back:'#'});
}

/* ---------- group ---------- */
function group(g){
  view=null;const it=groupItems(g),c=counts(it);
  let h=crumbs([{t:'Trang chủ',go:'#'},{t:g.name}])+`<div class="hdr"><div><h1>${esc(g.name)}</h1><p class="sub">${g.sets.length} học phần · ${fmt(it.length)} thẻ · ${fmt(c[2])} đã thuộc · ${fmt(c[1])} đang học</p></div>
  <div class="acts"><button class="btn primary" id="ga" type="button">Học cả nhóm</button><button class="btn" id="gl" type="button" ${c[1]?'':'disabled'}>Ôn thẻ đang học (${fmt(c[1])})</button></div></div>`;
  const subs=new Map();
  for(const s of g.sets){const k=g.sub?g.sub(s.title):'';(subs.get(k)||subs.set(k,[]).get(k)).push(s)}
  for(const [k,list] of [...subs].sort((a,b)=>a[0].localeCompare(b[0],'vi',{numeric:true}))){
    h+=k?`<h3>${esc(k)}</h3>`:'<div style="height:18px"></div>';
    h+='<div class="sets">'+list.map(s=>{const sc=counts(s.items);return `<button class="row" type="button" data-s="${s.id}"><b>${esc(s.title)}</b>${segBar(sc)}<span class="n">${sc[2]}/${s.items.length}</span></button>`}).join('')+'</div>';
  }
  app.innerHTML=h;bindCrumbs();
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>nav('#set-'+b.dataset.s));
  $('#ga').onclick=()=>study({title:g.name+' · cả nhóm',items:it,back:'#g-'+g.id,crumb:[{t:'Trang chủ',go:'#'},{t:g.name,go:'#g-'+g.id},{t:'Cả nhóm'}]});
  $('#gl').onclick=()=>study({title:g.name+' · thẻ đang học',items:shuffle(it.filter(x=>stOf(x)===1)),back:'#g-'+g.id,crumb:[{t:'Trang chủ',go:'#'},{t:g.name,go:'#g-'+g.id},{t:'Thẻ đang học'}]});
  window.scrollTo(0,0);
}

/* ---------- study ---------- */
let view=null;
const PREF=LS.get('pref',{front:'en',auto:false});
const savePref=()=>LS.set('pref',PREF);
function study(v){
  view={mode:'cards',filter:'all',pos:0,flip:false,...v};view.order=view.items.map((_,i)=>i);applyFilter(false);render();window.scrollTo(0,0)}
function applyFilter(sh){
  let o=view.items.map((_,i)=>i);
  if(view.filter!=='all'){const want={new:0,learn:1,known:2}[view.filter];o=o.filter(i=>stOf(view.items[i])===want)}
  if(sh)shuffle(o);view.order=o;view.pos=0;view.flip=false;view.q=null}
function render(){
  const c=counts(view.items);
  const cr=view.crumb||(view.set?[{t:'Trang chủ',go:'#'},{t:view.set.group.name,go:'#g-'+view.set.group.id},{t:view.set.title}]:[{t:'Trang chủ',go:'#'},{t:view.title}]);
  app.innerHTML=crumbs(cr)+`<h1>${esc(view.title)}</h1><p class="sub">${fmt(view.items.length)} thẻ</p>
  <div class="tabs" role="tablist">${[['cards','Thẻ ghi nhớ'],['quiz','Trắc nghiệm'],['write','Gõ từ'],['list','Danh sách']].map(([m,l])=>`<button class="tab" role="tab" type="button" data-m="${m}" aria-selected="${view.mode===m}">${l}</button>`).join('')}</div>
  <div class="bar"><div class="chips" role="group" aria-label="Lọc theo trạng thái">
    ${[['all','Tất cả',view.items.length],['new','Chưa học',c[0]],['learn','Đang học',c[1]],['known','Đã thuộc',c[2]]].map(([f,l,n])=>`<button class="chip" type="button" data-f="${f}" aria-pressed="${view.filter===f}">${l} <span class="c">${n}</span></button>`).join('')}
  </div><span class="spacer"></span>
    <button class="opt" id="o-front" type="button" aria-pressed="${PREF.front==='vi'}" title="Đổi mặt trước">${IC.swap}${PREF.front==='en'?'Mặt trước: Anh':'Mặt trước: Việt'}</button>
    <button class="opt" id="o-auto" type="button" aria-pressed="${PREF.auto}" title="Tự đọc khi chuyển thẻ">${IC.auto}Tự đọc</button>
    <button class="opt" id="o-shuf" type="button">${IC.shuf}Trộn</button>
  </div><div id="pane"></div>`;
  bindCrumbs();
  app.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{view.mode=t.dataset.m;view.q=null;view.pos=Math.min(view.pos,Math.max(0,view.order.length-1));render()});
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{view.filter=b.dataset.f;applyFilter(false);render()});
  $('#o-front').onclick=()=>{PREF.front=PREF.front==='en'?'vi':'en';savePref();view.q=null;render()};
  $('#o-auto').onclick=()=>{PREF.auto=!PREF.auto;savePref();render()};
  $('#o-shuf').onclick=()=>{applyFilter(true);render();toast('Đã trộn thứ tự thẻ')};
  ({cards,quiz,write,list})[view.mode]();
}
function refreshChips(){const c=counts(view.items);app.querySelectorAll('[data-f] .c').forEach((el,i)=>el.textContent=[view.items.length,c[0],c[1],c[2]][i])}
const front=it=>{const [en,vi]=enVi(it);return PREF.front==='en'?{t:en,lang:'en'}:{t:vi,lang:'vi'}};
const backOf=it=>{const [en,vi]=enVi(it);return PREF.front==='en'?{t:vi,lang:'vi'}:{t:en,lang:'en'}};
const ipaOf=it=>it.c[2]?`/${it.c[2]}/`:'';

function cards(){
  const p=$('#pane'),o=view.order;
  if(!o.length){p.innerHTML=`<p class="empty">Không có thẻ nào trong mục này.</p>`;return}
  const it=view.items[o[view.pos]],[en,vi]=enVi(it),st=stOf(it),f=front(it),b=backOf(it),ipa=ipaOf(it);
  p.innerHTML=`<div class="stage"><div class="flip ${view.flip?'on':''}" id="fl" tabindex="0" role="button" aria-label="Lật thẻ">
    <div class="face front"><span class="st">${badge(st)}</span><span class="lang">${f.lang==='en'?'EN':'VI'}</span>
      <div class="${f.lang==='en'?'word':'mean'}">${esc(f.t)||'—'}</div>${f.lang==='en'&&ipa?`<div class="ipa">${esc(ipa)}</div>`:''}
      <div class="say"><button class="sbtn" type="button" data-say="${f.lang}">${IC.spk}${f.lang==='en'?'Nghe':'Đọc'}</button></div>
      <span class="hint">Chạm thẻ để lật</span></div>
    <div class="face back"><span class="st">${badge(st)}</span><span class="lang">${b.lang==='en'?'EN':'VI'}</span>
      <div class="${b.lang==='en'?'word':'mean'}">${esc(b.t)||'—'}</div>${b.lang==='en'&&ipa?`<div class="ipa">${esc(ipa)}</div>`:''}
      <div class="small-term">${esc(f.t)}${f.lang==='en'&&ipa?` <span class="ipa sm">${esc(ipa)}</span>`:''}</div>
      <div class="say"><button class="sbtn" type="button" data-say="en">${IC.spk}Tiếng Anh</button><button class="sbtn" type="button" data-say="vi">${IC.spk}Tiếng Việt</button><button class="sbtn" type="button" data-say="both">${IC.spk}Cả hai</button></div>
    </div></div></div>
  <div class="prog"><i style="width:${(view.pos+1)/o.length*100}%"></i></div>
  <div class="ctl"><button class="btn" id="pv" type="button" aria-label="Thẻ trước" ${view.pos?'':'disabled'}>←</button>
    <button class="btn learn" id="mk1" type="button">Chưa thuộc</button><button class="btn known" id="mk2" type="button">Đã thuộc</button>
    <button class="btn" id="nx" type="button" aria-label="Thẻ sau" ${view.pos<o.length-1?'':'disabled'}>→</button></div>
  <div class="count">${view.pos+1} / ${o.length}</div>
  <p class="keys"><kbd>Space</kbd> lật thẻ · <kbd>←</kbd><kbd>→</kbd> chuyển thẻ · <kbd>1</kbd> chưa thuộc · <kbd>2</kbd> đã thuộc · <kbd>S</kbd> nghe</p>`;
  $('#fl').onclick=e=>{const s=e.target.closest('[data-say]');if(s){e.stopPropagation();const w=s.dataset.say;w==='both'?sayBoth(it):say(w==='en'?en:vi,w);return}flip()};
  $('#pv').onclick=()=>go(-1);$('#nx').onclick=()=>go(1);
  $('#mk1').onclick=()=>mark(1);$('#mk2').onclick=()=>mark(2);
  if(PREF.auto&&!view.spoke){view.spoke=true;view.flip?say(b.t,b.lang):say(f.t,f.lang)}
}
function flip(){view.flip=!view.flip;view.spoke=false;const fl=$('#fl');if(fl){fl.classList.toggle('on',view.flip)}
  if(PREF.auto){const it=view.items[view.order[view.pos]],s=view.flip?backOf(it):front(it);view.spoke=true;say(s.t,s.lang)}}
function go(d){const n=view.order.length;const np=Math.max(0,Math.min(n-1,view.pos+d));if(np===view.pos)return;view.pos=np;view.flip=false;view.spoke=false;cards()}
function mark(v){const it=view.items[view.order[view.pos]];setSt(it,v);refreshChips();
  if(view.pos<view.order.length-1)go(1);else{cards();toast(`Đã xem hết ${view.order.length} thẻ`)}}
document.addEventListener('keydown',e=>{
  if(!view||view.mode!=='cards'||/INPUT|TEXTAREA/.test(document.activeElement?.tagName))return;
  const it=view.items[view.order[view.pos]];if(!it)return;
  if(e.key===' '){e.preventDefault();flip()}else if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);
  else if(e.key==='1')mark(1);else if(e.key==='2')mark(2);
  else if(e.key==='s'||e.key==='S'){const [en]=enVi(it);say(en,'en')}
});

/* quiz */
function quiz(){
  const p=$('#pane');
  if(!view.q)view.q={o:shuffle([...view.order]),i:0,g:0,r:0,right:[]};
  const S=view.q;if(!S.o.length){p.innerHTML='<p class="empty">Không có thẻ nào trong mục này.</p>';return}
  if(S.i>=S.o.length)return finish(p,S,()=>{view.q=null;quiz()});
  const it=view.items[S.o[S.i]],f=front(it),ans=backOf(it).t,ipa=ipaOf(it);
  if(!S.opts){const pool=view.items.length>=8?view.items:allItems(),seen=new Set([ans]),w=[];
    for(let t=0;t<300&&w.length<3;t++){const x=backOf(pool[Math.random()*pool.length|0]).t;if(x&&!seen.has(x)){seen.add(x);w.push(x)}}
    S.opts=shuffle([ans,...w])}
  p.innerHTML=`<div class="qcard"><div class="qtop"><span>Câu ${S.i+1} / ${S.o.length}</span><span><span class="g">Đúng ${S.g}</span> · <span class="r">Sai ${S.r}</span></span></div>
   <div class="qprompt"><div class="${f.lang==='en'?'word':'mean'}">${esc(f.t)}</div>${f.lang==='en'&&ipa?`<div class="ipa">${esc(ipa)}</div>`:''}</div>
   <button class="sbtn" type="button" id="qs">${IC.spk}Nghe</button>
   <div class="answers">${S.opts.map((o,j)=>`<button class="ans" type="button" data-j="${j}"><span class="k">${'ABCD'[j]}</span><span>${esc(o)}</span></button>`).join('')}</div>
   <div class="qact" id="qa" hidden><button class="btn primary" id="qn" type="button">Câu tiếp →</button></div></div>`;
  $('#qs').onclick=()=>say(f.t,f.lang);
  if(PREF.auto)say(f.t,f.lang);
  p.querySelectorAll('.ans').forEach(b=>b.onclick=()=>{
    const ok=S.opts[+b.dataset.j]===ans;
    p.querySelectorAll('.ans').forEach((x,xi)=>{x.disabled=true;if(S.opts[xi]===ans)x.classList.add('right')});
    if(ok){S.g++;S.right.push(it)}else{S.r++;b.classList.add('wrong');if(stOf(it)!==1)setSt(it,1)}
    $('#qa').hidden=false;$('#qn').focus();$('#qn').onclick=()=>{S.i++;S.opts=null;quiz()};
  });
}
function finish(p,S,again){
  const n=S.o.length;
  p.innerHTML=`<div class="qcard result"><div class="sub">Kết quả</div><div class="big">${S.g}/${n}</div>
  <p class="sub" style="max-width:46ch;margin:0 auto 18px">${S.r?`Các câu sai đã được chuyển sang mục <b>Đang học</b> để bạn ôn lại.`:'Bạn trả lời đúng tất cả các câu.'}</p>
  <div class="qact" style="justify-content:center"><button class="btn" id="ag" type="button">Làm lại</button>${S.right.length?`<button class="btn known" id="mkall" type="button">Đánh dấu ${S.right.length} câu đúng là đã thuộc</button>`:''}</div></div>`;
  $('#ag').onclick=again;
  const m=$('#mkall');if(m)m.onclick=()=>{S.right.forEach(it=>setSt(it,2));refreshChips();m.disabled=true;m.textContent='Đã đánh dấu'};
}

/* write */
const norm=s=>deacc(String(s)).replace(/\(.*?\)/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function write(){
  const p=$('#pane');
  if(!view.q)view.q={o:shuffle([...view.order]),i:0,g:0,r:0,right:[]};
  const S=view.q;if(!S.o.length){p.innerHTML='<p class="empty">Không có thẻ nào trong mục này.</p>';return}
  if(S.i>=S.o.length)return finish(p,S,()=>{view.q=null;write()});
  const it=view.items[S.o[S.i]],[en,vi]=enVi(it),askVi=PREF.front==='en',prompt=askVi?vi:en,target=askVi?en:vi,ipa=ipaOf(it);
  p.innerHTML=`<div class="qcard"><div class="qtop"><span>Câu ${S.i+1} / ${S.o.length}</span><span><span class="g">Đúng ${S.g}</span> · <span class="r">Sai ${S.r}</span></span></div>
   <div class="qprompt"><div class="${askVi?'mean':'word'}">${esc(prompt)}</div></div>
   <form id="wf"><input class="winput" id="wi" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${askVi?'Gõ từ tiếng Anh':'Gõ nghĩa tiếng Việt'}" aria-label="Câu trả lời"></form>
   <div id="wfb"></div>
   <div class="qact"><button class="btn ghost" id="sk" type="button">Không biết</button><button class="btn primary" id="ck" type="button">Kiểm tra</button></div></div>`;
  const inp=$('#wi');inp.focus();let done=false;
  const check=give=>{
    if(done){S.i++;return write()}
    const ok=!give&&norm(inp.value)&&norm(inp.value)===norm(target);done=true;inp.disabled=true;
    if(ok){S.g++;S.right.push(it)}else{S.r++;if(stOf(it)!==1)setSt(it,1)}
    $('#wfb').innerHTML=ok?`<div class="fb ok">Chính xác. ${ipa?`<span class="ipa sm">${esc(ipa)}</span>`:''}</div>`:`<div class="fb bad">Đáp án: <b>${esc(target)}</b> ${ipa?`<span class="ipa sm">${esc(ipa)}</span>`:''}</div>`;
    say(en,'en');$('#ck').textContent='Câu tiếp →';$('#sk').hidden=true;$('#ck').focus();
  };
  $('#wf').onsubmit=e=>{e.preventDefault();check(false)};$('#ck').onclick=()=>check(false);$('#sk').onclick=()=>check(true);
}

/* list */
function list(){
  const p=$('#pane');
  if(!view.order.length){p.innerHTML=`<p class="empty">${view.search?'Không tìm thấy từ nào khớp.':'Không có thẻ nào trong mục này.'}</p>`;return}
  const multi=new Set(view.items.map(i=>i.sid)).size>1;
  p.innerHTML=`<div class="list">${view.order.map(ix=>{const it=view.items[ix],[en,vi]=enVi(it),st=stOf(it);
    return `<div class="item"><button class="sdot" type="button" data-st="${ix}" title="${ST_LABEL[st]} – bấm để đổi" aria-label="Trạng thái: ${ST_LABEL[st]}"><span class="dot ${ST_CLS[st]}"></span></button>
      <div><div class="t">${esc(en)}</div>${it.c[2]?`<div class="ipa sm">${esc(ipaOf(it))}</div>`:''}${multi?`<span class="from">${esc(SETS.get(it.sid)?.title)}</span>`:''}</div>
      <div class="m">${esc(vi)}</div>
      <div class="acts"><button class="ib" type="button" data-en="${ix}" title="Nghe tiếng Anh" aria-label="Nghe tiếng Anh">${IC.spk}</button><button class="ib" type="button" data-vi="${ix}" title="Đọc nghĩa tiếng Việt" aria-label="Đọc tiếng Việt" style="font:700 11px var(--mono)">VI</button></div></div>`}).join('')}</div>`;
  p.querySelectorAll('[data-en]').forEach(b=>b.onclick=()=>say(enVi(view.items[b.dataset.en])[0],'en'));
  p.querySelectorAll('[data-vi]').forEach(b=>b.onclick=()=>say(enVi(view.items[b.dataset.vi])[1],'vi'));
  p.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{const it=view.items[b.dataset.st],v=(stOf(it)+1)%3;setSt(it,v);
    b.innerHTML=`<span class="dot ${ST_CLS[v]}"></span>`;b.title=ST_LABEL[v]+' – bấm để đổi';b.setAttribute('aria-label','Trạng thái: '+ST_LABEL[v]);refreshChips()});
}

/* search */
let sto;
$('#q').addEventListener('input',e=>{clearTimeout(sto);sto=setTimeout(()=>{
  const raw=e.target.value.trim(),q=norm(raw);
  if(!q){if(view?.search)route();return}
  const hits=allItems().filter(it=>norm(it.c[0]).includes(q)||norm(it.c[1]).includes(q)).slice(0,300);
  view={mode:'list',filter:'all',pos:0,flip:false,search:true,title:`Kết quả cho “${raw}”`,items:hits,crumb:[{t:'Trang chủ',go:'#'},{t:'Tìm kiếm'}]};
  view.order=hits.map((_,i)=>i);render();
},220)});
$('#home').onclick=()=>{$('#q').value='';nav('#')};

/* routing */
function route(){
  const h=location.hash;let m;
  if((m=h.match(/^#g-([\w-]+)$/))&&GMAP.has(m[1]))return group(GMAP.get(m[1]));
  if((m=h.match(/^#set-(\d+)$/))&&SETS.has(m[1])){const s=SETS.get(m[1]);return study({title:s.title,items:s.items,set:s})}
  home();window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
fetch('vocab.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{prepare(d);topstat();route()})
  .catch(()=>{app.innerHTML='<p class="empty">Không tải được dữ liệu từ vựng. Tải lại trang để thử lần nữa.</p>'});
})();
</script>
